[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diskdiet"
version = "0.1.0"
description = "Free up disk space safely: find old node_modules, venvs, caches, duplicates and big files, tidy your Downloads, with undo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KHOR EE ZHE" }]
requires-python = ">=3.9"
keywords = ["disk", "cleanup", "node_modules", "duplicates", "downloads", "cli", "disk-space"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
diskdiet = "diskdiet.cli:main"

[project.urls]
Homepage = "https://github.com/Ee0422/diskdiet"
Issues = "https://github.com/Ee0422/diskdiet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/diskdiet"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
